<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Royal Crimson Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#7E0F25" />
      <stop offset="60%" stopColor="#5A0A1A" />
      <stop offset="100%" stopColor="#3A040F" />
    </radialGradient>

    <!-- Radiant Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF2A3" />
      <stop offset="35%" stopColor="#DFB744" />
      <stop offset="70%" stopColor="#C9A65A" />
      <stop offset="100%" stopColor="#8F6222" />
    </linearGradient>

    <!-- Sacred Kumkum Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FF2A4B" />
      <stop offset="50%" stopColor="#D90429" />
      <stop offset="100%" stopColor="#8A0018" />
    </linearGradient>

    <!-- Camphor White Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="70%" stopColor="#FFFDF6" />
      <stop offset="100%" stopColor="#F5EBD2" />
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#FF6D00" />
      <stop offset="100%" stopColor="#FFD54F" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Disc -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Sacred Aura / Halo behind Namam -->
  <circle cx="64" cy="62" r="38" fill="url(#goldGrad)" opacity="0.12" />

  <!-- ================= LEFT: MINI SUDARSHANA CHAKRA ================= -->
  <g transform="translate(23, 62)">
    <!-- Flame Crest -->
    <path d="M 0 -13 C -2 -17, -1 -19, 0 -21 C 1 -19, 2 -17, 0 -13 Z" fill="url(#flameGrad)" />
    <!-- Chakra Disc -->
    <circle cx="0" cy="0" r="10.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
    <circle cx="0" cy="0" r="2.8" fill="url(#goldGrad)" />
    <!-- Spokes -->
    <line x1="-8" y1="0" x2="8" y2="0" stroke="url(#goldGrad)" stroke-width="1.2" />
    <line x1="0" y1="-8" x2="0" y2="8" stroke="url(#goldGrad)" stroke-width="1.2" />
    <line x1="-5.6" y1="-5.6" x2="5.6" y2="5.6" stroke="url(#goldGrad)" stroke-width="1.2" />
    <line x1="-5.6" y1="5.6" x2="5.6" y2="-5.6" stroke="url(#goldGrad)" stroke-width="1.2" />
  </g>

  <!-- ================= CENTER: LORD VENKATESWARA THIRUMAN NAMAM ================= -->
  <g transform="translate(64, 60)">
    <!-- Golden Lotus Pedestal (Padma Peetam) -->
    <path d="M -16 28 C -10 23, -5 25, 0 28 C 5 25, 10 23, 16 28 C 11 34, -11 34, -16 28 Z" fill="url(#goldGrad)" />

    <!-- Outer Namam Wings (Vishnu Padam) -->
    <!-- Left Wing -->
    <path d="M -15 -28 
             C -17 -12, -13 8, -7 20
             C -4 24, -1.5 27, 0 28
             C -0.8 25, -2.5 20, -4.5 16
             C -9 7, -9.5 -9, -9 -28
             Z" 
          fill="url(#whiteGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="1" />

    <!-- Right Wing -->
    <path d="M 15 -28 
             C 17 -12, 13 8, 7 20
             C 4 24, 1.5 27, 0 28
             C 0.8 25, 2.5 20, 4.5 16
             C 9 7, 9.5 -9, 9 -28
             Z" 
          fill="url(#whiteGrad)" 
          stroke="url(#goldGrad)" 
          stroke-width="1" />

    <!-- Base Connector U-Curve -->
    <path d="M -8 18 C -5 24, -2.5 27, 0 28.5 C 2.5 27, 5 24, 8 18 C 5 21, 2.5 24, 0 24.5 C -2.5 24, -5 21, -8 18 Z" fill="url(#goldGrad)" />

    <!-- Central Sacred Vermilion Tilakam (Sri Churnam - Goddess Padmavathi) -->
    <path d="M 0 -35
             C -2.2 -18, -3 2, -3 15
             C -3 21, -1.8 24, 0 25.5
             C 1.8 24, 3 21, 3 15
             C 3 2, 2.2 -18, 0 -35
             Z" 
          fill="url(#redGrad)" 
          filter="drop-shadow(0 0 2px rgba(255, 42, 75, 0.8))" />

    <!-- Center Gold Highlight -->
    <line x1="0" y1="-30" x2="0" y2="18" stroke="#FFF2A3" stroke-width="0.8" opacity="0.9" />
  </g>

  <!-- ================= RIGHT: MINI PANCHAJANYA SHANKHA ================= -->
  <g transform="translate(105, 62)">
    <!-- Flame Crest -->
    <path d="M 0 -13 C -2 -17, -1 -19, 0 -21 C 1 -19, 2 -17, 0 -13 Z" fill="url(#flameGrad)" />
    <!-- Conch Body -->
    <path d="M -2 -10 C 6 -11, 11 -6, 11 0 C 11 6, 6 10, -1 11 C -6 11.5, -10 7, -10 2 C -10 -5, -6 -9.5, -2 -10 Z" fill="url(#whiteGrad)" stroke="url(#goldGrad)" stroke-width="1.4" />
    <path d="M -5 -4 C -2 -7, 3 -6, 5 -3 C 6 0, 5 4, 2 6 C -1 7.5, -5 5, -5 1" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" />
  </g>

  <!-- Auspicious Star Accents -->
  <circle cx="64" cy="14" r="1.5" fill="url(#goldGrad)" />
  <circle cx="64" cy="114" r="1.5" fill="url(#goldGrad)" />
</svg>
